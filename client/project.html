<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="project-detail-page">

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--top" aria-hidden="true"></div>

  <nav class="navbar navbar--scrolled">
    <div class="container nav-container">
      <a href="/" class="nav-logo nav-back">← Back to Portfolio</a>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <div id="project-content" class="project-content reveal">
        <p class="loading-text">Loading project...</p>
      </div>
    </div>
  </main>

  <footer class="footer footer-minimal">
    <div class="container">
      <div class="footer-bottom">
        <p class="footer-copy">&copy; <span id="footer-year"></span> Arman Khachatryan</p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();
    requestAnimationFrame(() => {
      document.querySelector(".reveal")?.classList.add("visible");
    });
  </script>
  <script src="/js/project-page.js"></script>
</body>
</html>
